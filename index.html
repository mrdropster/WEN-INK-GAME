  <script>
    /* =========================================================
       AUDIO SYNTHESIZER (Pure Web Audio API - Retro 90s sound effects)
       ========================================================= */
    class RetroAudio {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
      }

      // Snort and "Ptooey!" spit sound
      playSpit(isBeavis) {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;

        // Snort noise burst
        const bufferSize = this.ctx.sampleRate * 0.08;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(isBeavis ? 1200 : 700, now);

        const noiseGain = this.ctx.createGain();
        noiseGain.gain.setValueAtTime(0.3, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);

        noise.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(this.ctx.destination);
        noise.start(now);

        // Sharp descending whistle tone
        const osc = this.ctx.createOscillator();
        const oscGain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(isBeavis ? 850 : 580, now + 0.03);
        osc.frequency.exponentialRampToValueAtTime(140, now + 0.25);

        oscGain.gain.setValueAtTime(0.35, now + 0.03);
        oscGain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);

        osc.connect(oscGain);
        oscGain.connect(this.ctx.destination);
        osc.start(now + 0.03);
        osc.stop(now + 0.26);
      }

      // Wet splat on ground or target
      playSplat(isTarget) {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(isTarget ? 240 : 130, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.12);

        gain.gain.setValueAtTime(isTarget ? 0.45 : 0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.13);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.14);

        if (isTarget) {
          // Angry squeak vocal
          const voc = this.ctx.createOscillator();
          const vocGain = this.ctx.createGain();
          voc.type = 'square';
          voc.frequency.setValueAtTime(380, now + 0.02);
          voc.frequency.linearRampToValueAtTime(560, now + 0.14);
          voc.frequency.exponentialRampToValueAtTime(100, now + 0.3);

          vocGain.gain.setValueAtTime(0.2, now + 0.02);
          vocGain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);

          voc.connect(vocGain);
          vocGain.connect(this.ctx.destination);
          voc.start(now + 0.02);
          voc.stop(now + 0.31);
        }
      }

      // Authentic chuckle
      playLaughter(isBeavis) {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const count = isBeavis ? 4 : 3;
        for (let i = 0; i < count; i++) {
          const t = now + i * 0.12;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = isBeavis ? 'sawtooth' : 'triangle';
          osc.frequency.setValueAtTime(isBeavis ? 280 + i * 20 : 160 - (i % 2) * 20, t);
          osc.frequency.exponentialRampToValueAtTime(90, t + 0.09);

          gain.gain.setValueAtTime(0.25, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.11);
        }
      }
    }

    /* =========================================================

    /* =========================================================
       LOOGIE PROJECTILE CLASS (True 3D depth towards background)
       ========================================================= */
    class Loogie {
      constructor(startX, startY, isBeavis) {
        this.x = startX;
        this.y = startY; // starts in foreground (y ≈ 410)
        this.zHeight = 35; // height above ground plane
        this.vx = (wind * 0.7); // initial curve with wind
        this.vy = -5.8; // moves forward / UP towards the background
        this.vz = 2.4; // arch gravity curve
        this.isBeavis = isBeavis;
        this.size = 9; // scales down as it moves away
        this.isDead = false;
        this.tail = [];
        audio.playSpit(isBeavis);
      }

      update() {
        // Wind continuously drifts the loogie horizontally
        this.x += this.vx + wind * 0.12;
        this.y += this.vy;

        // Parabolic arc (up then falls to ground plane)
        this.zHeight += this.vz;
        this.vz -= 0.14; // gravity

        // Scales down from 9px near player to 3px in distance
        const depthRatio = Math.max(0.1, (this.y - 120) / (INTERNAL_H - 120));
        this.size = 3.5 + depthRatio * 5.5;

        // Tail drops
        this.tail.push({ x: this.x, y: this.y, size: this.size * 0.6, alpha: 0.8 });
        for (let i = this.tail.length - 1; i >= 0; i--) {
          this.tail[i].alpha -= 0.1;
          if (this.tail[i].alpha <= 0) this.tail.splice(i, 1);
        }

        // Check if hit the ground plane or upper road limit
        if (this.zHeight <= 0 || this.y <= 95) {
          this.splat();
        }
      }

      splat() {
        this.isDead = true;
        audio.playSplat(false);
        splatters.push({
          x: this.x,
          y: this.y,
          r: this.size * 1.5,
          alpha: 1.0,
          color: '#84cc16'
        });
      }

      draw(c) {
        // Ground shadow beneath loogie
        const shadowY = this.y + Math.max(0, this.zHeight);
        c.fillStyle = 'rgba(0,0,0,0.3)';
        c.beginPath();
        c.ellipse(this.x, shadowY, this.size * 0.9, this.size * 0.4, 0, 0, Math.PI * 2);
        c.fill();

        // Droplet tail
        this.tail.forEach(t => {
          c.fillStyle = `rgba(132, 204, 22, ${t.alpha})`;
          c.beginPath();
          c.arc(t.x, t.y, t.size, 0, Math.PI * 2);
          c.fill();
        });

        // Main loogie bead
        c.save();
        c.translate(this.x, this.y);
        c.fillStyle = '#bef264';
        c.beginPath();
        c.arc(0, 0, this.size, 0, Math.PI * 2);
        c.fill();
        c.lineWidth = 1.5;
        c.strokeStyle = '#365314';
        c.stroke();

        // White slime shine reflection
        c.fillStyle = '#ffffff';
        c.beginPath();
        c.arc(-this.size * 0.3, -this.size * 0.3, this.size * 0.3, 0, Math.PI * 2);
        c.fill();
        c.restore();
      }
    }

    /* =========================================================
       PEDESTRIAN CLASS (TOP-DOWN BIRD'S EYE VIEW)
       ========================================================= */
    class Pedestrian {
      constructor(type, speedMultiplier = 1.0) {
        this.type = type;
        this.fromLeft = Math.random() > 0.5;
        const baseSpeed = (type.speed + (Math.random() * 0.4 - 0.2)) * speedMultiplier;
        this.speed = baseSpeed * (this.fromLeft ? 1 : -1);
        this.x = this.fromLeft ? -45 : INTERNAL_W + 45;
        this.y = type.yPlane + (Math.random() * 18 - 9);
        this.radius = type.radius;
        this.isHit = false;
        this.hitTimer = 0;
        this.walkCycle = Math.random() * Math.PI * 2;
        this.shakeX = 0;
        this.slimeBlobs = [];
        this.activeBubble = null;
      }

      update() {
        if (!this.isHit) {
          this.x += this.speed;
          this.walkCycle += Math.abs(this.speed) * 0.12;
          if (this.activeBubble) {
            this.activeBubble.x = this.x;
            this.activeBubble.y = this.y - 28;
          }
        } else {
          this.hitTimer -= 0.025;
          this.shakeX = (Math.random() - 0.5) * 8;
        }
      }

      hit() {
        if (this.isHit) return;
        this.isHit = true;
        this.hitTimer = 1.8; // Shorter freeze time so pedestrians cycle quickly

        if (this.activeBubble) {
          const idx = speechBubbles.indexOf(this.activeBubble);
          if (idx !== -1) speechBubbles.splice(idx, 1);
          this.activeBubble = null;
        }

        audio.playSplat(true);
        audio.playLaughter(selectedCharacter === 'Beavis');

        for (let i = 0; i < 5; i++) {
          this.slimeBlobs.push({
            ox: (Math.random() - 0.5) * this.radius * 1.2,
            oy: (Math.random() - 0.5) * this.radius * 1.2,
            r: 3 + Math.random() * 5
          });
        }

        const phrase = this.type.phrases[Math.floor(Math.random() * this.type.phrases.length)];
        speechBubbles.push({
          x: this.x,
          y: this.y - 28,
          text: phrase,
          life: 1.8,
          isAmbient: false
        });
      }

      sayAmbient(text) {
        if (this.isHit || this.activeBubble) return;
        const b = {
          x: this.x,
          y: this.y - 28,
          text: text,
          life: 2.0,
          isAmbient: true
        };
        this.activeBubble = b;
        speechBubbles.push(b);
      }

      isOffscreen() {
        if (this.isHit && this.hitTimer <= 0) return true;
        if (this.speed > 0 && this.x > INTERNAL_W + 60) return true;
        if (this.speed < 0 && this.x < -60) return true;
        return false;
      }

      draw(c) {
        c.save();
        const px = this.x + this.shakeX;
        const py = this.y;
        c.translate(px, py);

        // Walking arms swinging in top-down perspective
        const armSwing = Math.sin(this.walkCycle) * 7;

        // Shadow under pedestrian
        c.fillStyle = 'rgba(0,0,0,0.35)';
        c.beginPath();
        c.ellipse(0, 4, this.radius * 1.2, this.radius * 0.7, 0, 0, Math.PI * 2);
        c.fill();

        // Shoulders / Coat (Top-down view)
        c.fillStyle = this.isHit ? '#854d0e' : this.type.suitColor;
        c.strokeStyle = '#000000';
        c.lineWidth = 2.5;
        c.beginPath();
        c.ellipse(0, 0, this.radius * 1.25, this.radius * 0.85, 0, 0, Math.PI * 2);
        c.fill();
        c.stroke();

        // Hands swinging
        c.fillStyle = '#fed7aa';
        c.beginPath();
        c.arc(-this.radius * 1.2, armSwing, 3.5, 0, Math.PI * 2);
        c.arc(this.radius * 1.2, -armSwing, 3.5, 0, Math.PI * 2);
        c.fill();
        c.stroke();

        // Head (Circle seen from above)
        c.fillStyle = this.isHit ? '#ef4444' : '#fecaca'; // Turns fiery red when hit!
        c.beginPath();
        c.arc(0, -2, this.radius * 0.65, 0, Math.PI * 2);
        c.fill();
        c.stroke();

        // Hair / Bald spot
        c.fillStyle = this.type.hairColor;
        if (this.type.baldSpot) {
          // Fringe ring around bald head
          c.beginPath();
          c.arc(0, -2, this.radius * 0.65, Math.PI * 0.2, Math.PI * 1.8);
          c.stroke();
          // Small grey hair tufts
          c.fillRect(-this.radius * 0.6, -5, 3, 6);
          c.fillRect(this.radius * 0.5, -5, 3, 6);
        } else {
          // Full hair cover
          c.beginPath();
          c.arc(0, -3, this.radius * 0.62, 0, Math.PI * 2);
          c.fill();
        }

        // Green dripping slime splattered on victim
        if (this.isHit) {
          c.fillStyle = '#84cc16';
          c.strokeStyle = '#14532d';
          c.lineWidth = 1.5;

          // Main center glob
          c.beginPath();
          c.ellipse(0, -2, 10, 8, 0, 0, Math.PI * 2);
          c.fill();
          c.stroke();

          // Droplets
          this.slimeBlobs.forEach(b => {
            c.beginPath();
            c.arc(b.ox, b.oy, b.r, 0, Math.PI * 2);
            c.fill();
          });
        }

        c.restore();
      }
    }

    /* =========================================================
       BACKGROUND CARS ON UPPER ROAD
       ========================================================= */
    class Car {
      constructor() {
        this.fromLeft = Math.random() > 0.5;
        this.speed = (3.2 + Math.random() * 2) * (this.fromLeft ? 1 : -1);
        this.x = this.fromLeft ? -100 : INTERNAL_W + 100;
        this.y = 135;
        this.color = ['#dc2626', '#2563eb', '#16a34a', '#ca8a04', '#475569'][Math.floor(Math.random() * 5)];
        this.isHit = false;
        this.hitTimer = 0;
      }

      update() {
        this.x += this.speed;
        if (this.isHit) this.hitTimer -= 0.02;
      }

      hit() {
        if (this.isHit) return;
        this.isHit = true;
        this.hitTimer = 2.0;
        audio.playSplat(true);
        audio.playLaughter(selectedCharacter === 'Beavis');
        speechBubbles.push({
          x: this.x,
          y: this.y - 20,
          text: "*HONK HONK!!* WATCH IT YA BRATS!",
          life: 2.2
        });
      }

      isOffscreen() {
        return (this.speed > 0 && this.x > INTERNAL_W + 120) || (this.speed < 0 && this.x < -120);
      }

      draw(c) {
        c.save();
        c.translate(this.x, this.y);

        // Car body (Top-down view)
        c.fillStyle = this.color;
        c.strokeStyle = '#000000';
        c.lineWidth = 3;
        c.beginPath();
        c.roundRect(-36, -14, 72, 28, [8]);
        c.fill();
        c.stroke();

        // Roof & Windshields
        c.fillStyle = '#94a3b8';
        c.fillRect(-18, -10, 36, 20);
        c.strokeRect(-18, -10, 36, 20);

        // Splat on car windshield
        if (this.isHit) {
          c.fillStyle = '#84cc16';
          c.beginPath();
          c.ellipse(0, 0, 16, 10, 0, 0, Math.PI * 2);
          c.fill();
        }

        c.restore();
      }
    }

      c.fillStyle = '#facc15';

      c.strokeText(scoreStr, 173, 36);

      c.fillText(timeStr, INTERNAL_W - 140, 36);

    /* =========================================================
       COMIC SPEECH BUBBLE SYSTEM
       ========================================================= */
    function drawSpeechBubbles(c) {
      for (let i = speechBubbles.length - 1; i >= 0; i--) {
        const bubble = speechBubbles[i];
        bubble.life -= 0.02;
        if (bubble.life <= 0) {
          // Detach reference if it belonged to a pedestrian
          pedestrians.forEach(p => {
            if (p.activeBubble === bubble) p.activeBubble = null;
          });
          speechBubbles.splice(i, 1);
          continue;
        }

        c.save();
        c.font = 'bold 15px "VT323", monospace';
        const txtW = c.measureText(bubble.text).width;
        const bW = txtW + 18;
        const bH = 26;
        const bx = Math.max(10, Math.min(INTERNAL_W - bW - 10, bubble.x - bW / 2));
        const by = bubble.y - bH;

        // Shadow
        c.fillStyle = 'rgba(0,0,0,0.4)';
        c.fillRect(bx + 3, by + 3, bW, bH);

        // White bubble with black border (slight yellowish tint for pre-hit ambient chatter)
        c.fillStyle = bubble.isAmbient ? '#fef08a' : '#ffffff';
        c.strokeStyle = '#000000';
        c.lineWidth = 2.5;
        c.fillRect(bx, by, bW, bH);
        c.strokeRect(bx, by, bW, bH);

        // Bubble pointer
        c.beginPath();
        c.moveTo(bubble.x - 4, by + bH);
        c.lineTo(bubble.x, by + bH + 6);
        c.lineTo(bubble.x + 4, by + bH);
        c.fillStyle = bubble.isAmbient ? '#fef08a' : '#ffffff';
        c.fill();
        c.stroke();

        // Text (Red for angry hits, Dark charcoal for ambient questions)
        c.fillStyle = bubble.isAmbient ? '#0f172a' : '#b91c1c';
        c.textAlign = 'center';
        c.textBaseline = 'middle';
        c.fillText(bubble.text, bx + bW / 2, by + bH / 2 + 1);
        c.restore();
      }
    }

    /* =========================================================
       SPITTING & ACTIONS
       ========================================================= */
    function doSpit() {
      if (isGameOver || spitCooldown > 0) return;
      audio.init();

      spitCooldown = SPIT_COOLDOWN_TIME;
      player.isSpitting = true;
      player.spitAnimTimer = 0.22;

      // Spawn loogie from mouth
      loogies.push(new Loogie(player.x, player.y - 20, selectedCharacter === 'Beavis'));
    }

    function switchCharacter() {
      audio.init();
      selectedCharacter = selectedCharacter === 'Butt-head' ? 'Beavis' : 'Butt-head';
      document.getElementById('charNameDisplay').textContent = selectedCharacter.toUpperCase();
      audio.playLaughter(selectedCharacter === 'Beavis');
    }

    /* =========================================================
       COLLISION LOGIC
       ========================================================= */
    function checkCollisions() {
      loogies.forEach(loogie => {
        if (loogie.isDead) return;

        // 1. Check Pedestrians (Generous hit detection for fast scoring)
        pedestrians.forEach(ped => {
          if (ped.isHit || loogie.isDead) return;

          const dist = Math.hypot(loogie.x - ped.x, loogie.y - ped.y);
          if (dist < ped.radius + loogie.size + 9) {
            loogie.splat();
            ped.hit();
            score++;
            if (score >= targetScore) {
              handleLevelComplete();
            }
          }
        });

        // 2. Check Cars
        cars.forEach(car => {
          if (car.isHit || loogie.isDead) return;
          if (Math.abs(loogie.x - car.x) < 42 && Math.abs(loogie.y - car.y) < 22) {
            loogie.splat();
            car.hit();
            score++;
            if (score >= targetScore) {
              handleLevelComplete();
            }
          }
        });

        // 3. Check Squirrel on sign
        if (squirrel.active && !loogie.isDead) {
          if (Math.abs(loogie.x - squirrel.x) < 22 && Math.abs(loogie.y - squirrel.y) < 18) {
            loogie.splat();
            squirrel.active = false;
            audio.playSplat(true);
            audio.playLaughter(true);
            speechBubbles.push({
              x: squirrel.x,
              y: squirrel.y - 20,
              text: "*SQUEEEEAK!!*",
              life: 1.8
            });
            score += 2;
            if (score >= targetScore) {
              handleLevelComplete();
            }
          }
        }
      });
    }

    /* =========================================================
       LEVEL PROGRESSION & MODAL SYSTEM
       ========================================================= */
    function showModal(title, desc, scoreText, btnText, mode, titleColorClass) {
      modalMode = mode;
      isGameOver = true;

      const overlay = document.getElementById('endOverlay');
      const titleElem = document.getElementById('endTitle');
      const descElem = document.getElementById('endDesc');
      const finalScoreElem = document.getElementById('finalScoreText');
      const btnElem = document.getElementById('modalActionBtn');

      overlay.classList.remove('hidden');
      overlay.classList.add('flex');

      titleElem.textContent = title;
      titleElem.className = `text-3xl arcade-font ${titleColorClass} mb-2 font-bold`;
      descElem.textContent = desc;
      finalScoreElem.textContent = scoreText;
      btnElem.textContent = btnText;
    }

    function handleLevelComplete() {
      audio.playLaughter(true);
      if (currentLevelIdx < LEVEL_CONFIGS.length - 1) {
        // Next Level available
        showModal(
          `LEVEL ${currentLevelIdx + 1} CLEARED! 🎸`,
          `"Whoa, dude! You actually nailed ${targetScore} targets! Ready for faster chumps?"`,
          `SCORE: ${score} / ${targetScore} (COMPLETED!)`,
          `Proceed to Level ${currentLevelIdx + 2} (Enter)`,
          'level_clear',
          'text-green-700'
        );
      } else {
        // Victory! Completed all 3 levels
        showModal(
          `CERTIFIED INK CHAD! 👑⚡`,
          `"WHOA!! You got 50 hits in 30 seconds!! You are the ultimate rooftop god! Huh-huh-huh!"`,
          `FINAL INK SCORE: ${score} / ${targetScore}`,
          `Restart from Level 1 (Enter)`,
          'victory',
          'text-yellow-600'
        );
      }
    }

    function handleTimeout() {
      showModal(
        `TIME'S UP, BUTT-MUNCH! 💩`,
        `"Huh-huh... You missed the quota! Only ${score} out of ${targetScore}! That sucked."`,
        `FINAL SCORE: ${score} / ${targetScore}`,
        `Retry Level ${currentLevelIdx + 1} (Enter)`,
        'game_over',
        'text-red-700'
      );
    }

    function initLevel(lvlIdx) {
      currentLevelIdx = lvlIdx;
      const cfg = LEVEL_CONFIGS[lvlIdx];
      score = 0;
      targetScore = cfg.targetScore;
      timeLeft = cfg.timeLimit;
      isGameOver = false;
      modalMode = 'none';

      loogies = [];
      pedestrians = [];
      cars = [];
      splatters = [];
      speechBubbles = [];
      squirrel.active = true;
      pedSpawnTimer = 0.2;
      carSpawnTimer = 2.0;

      document.getElementById('endOverlay').classList.add('hidden');
      document.getElementById('endOverlay').classList.remove('flex');
    }

    function handleModalAction() {
      if (modalMode === 'level_clear') {
        initLevel(currentLevelIdx + 1);
      } else if (modalMode === 'game_over') {
        initLevel(currentLevelIdx); // Retry same level
      } else if (modalMode === 'victory') {
        initLevel(0); // Start over from level 1
      }
    }

    /* =========================================================
       MAIN LOOP & UPDATES
       ========================================================= */
    function updateGame(delta) {
      if (isGameOver) return;

      const currentCfg = LEVEL_CONFIGS[currentLevelIdx];

      // Update timer
      timeLeft -= delta;
      if (timeLeft <= 0) {
        timeLeft = 0;
        if (score >= targetScore) {
          handleLevelComplete();
        } else {
          handleTimeout();
        }
        return;
      }

      // Spit cooldown tick
      if (spitCooldown > 0) {
        spitCooldown -= delta;
      }

      // Wind updates
      windChangeTimer -= delta;
      windsockFrame += delta * 60;
      if (windChangeTimer <= 0) {
        wind = (Math.random() * 6.4 - 3.2); // Wind variation
        windChangeTimer = 2.8 + Math.random() * 3.0;
      }

      // Player Movement
      player.vx = 0;
      if (keys.left) player.vx = -player.speed;
      if (keys.right) player.vx = player.speed;
      player.x = Math.max(90, Math.min(INTERNAL_W - 90, player.x + player.vx));

      // Spit recoil animation
      if (player.isSpitting) {
        player.spitAnimTimer -= delta;
        if (player.spitAnimTimer <= 0) player.isSpitting = false;
      }

      // Scurrying squirrel
      if (squirrel.active) {
        squirrel.x += squirrel.speed * currentCfg.pedSpeedMult;
        if (squirrel.x > squirrel.maxX || squirrel.x < squirrel.minX) {
          squirrel.speed *= -1;
        }
      }

      // Spawn pedestrians based on current level intensity
      pedSpawnTimer -= delta;
      if (pedSpawnTimer <= 0) {
        if (pedestrians.length < currentCfg.maxPedsOnScreen) {
          const type = PED_TYPES[Math.floor(Math.random() * PED_TYPES.length)];
          pedestrians.push(new Pedestrian(type, currentCfg.pedSpeedMult));
        }
        pedSpawnTimer = currentCfg.spawnIntervalMin + Math.random() * (currentCfg.spawnIntervalMax - currentCfg.spawnIntervalMin);
      }

      // Staggered ambient pedestrian chatter
      ambientChatterTimer -= delta;
      if (ambientChatterTimer <= 0) {
        const availablePeds = pedestrians.filter(p => !p.isHit && !p.activeBubble && p.x > 50 && p.x < INTERNAL_W - 50);
        if (availablePeds.length > 0) {
          const chosenPed = availablePeds[Math.floor(Math.random() * availablePeds.length)];
          const phrase = AMBIENT_CHATTER[Math.floor(Math.random() * AMBIENT_CHATTER.length)];
          chosenPed.sayAmbient(phrase);
        }
        ambientChatterTimer = 1.2 + Math.random() * 1.8;
      }

      // Spawn cars on upper street
      carSpawnTimer -= delta;
      if (carSpawnTimer <= 0) {
        cars.push(new Car());
        carSpawnTimer = currentCfg.carInterval + Math.random() * 2.0;
      }

      // Update Loogies
      loogies.forEach(l => l.update());
      loogies = loogies.filter(l => !l.isDead);

      // Update Pedestrians
      pedestrians.forEach(p => p.update());
      pedestrians = pedestrians.filter(p => !p.isOffscreen());

      // Update Cars
      cars.forEach(c => c.update());
      cars = cars.filter(c => !c.isOffscreen());

      // Splatters fade
      splatters.forEach(s => s.alpha -= delta * 0.18);
      splatters = splatters.filter(s => s.alpha > 0);

      // Collisions
      checkCollisions();
    }

    function renderGame() {
      // 1. Draw 1995 Authentic Scene
      drawOriginalScene(ctx);

      // 2. Ground Splatters
      splatters.forEach(s => {
        ctx.fillStyle = `rgba(132, 204, 22, ${s.alpha})`;
        ctx.beginPath();
        ctx.ellipse(s.x, s.y, s.r, s.r * 0.5, 0, 0, Math.PI * 2);
        ctx.fill();
      });

      // 3. Cars
      cars.forEach(c => c.draw(ctx));

      // 4. Pedestrians
      pedestrians.forEach(p => p.draw(ctx));

      // 5. Loogies
      loogies.forEach(l => l.draw(ctx));

      // 6. Speech Bubbles
      drawSpeechBubbles(ctx);

      // 7. Slacker Character Foreground (Player)
      drawPlayerCharacter(ctx);

      // 8. Authentic Retro HUD
      drawHUD(ctx);
    }

    let lastTime = performance.now();
    function loop(now) {
      const delta = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;
      updateGame(delta);
      renderGame();
      requestAnimationFrame(loop);
    }

    /* =========================================================
       EVENT LISTENERS & CONTROLS
       ========================================================= */
    window.addEventListener('keydown', (e) => {
      audio.init();
      if (e.code === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
        keys.left = true;
      }
      if (e.code === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
        keys.right = true;
      }
      if (e.code === 'Space') {
        e.preventDefault();
        doSpit();
      }
      if (e.code === 'Tab') {
        e.preventDefault();
        switchCharacter();
      }
      if (e.code === 'Enter' && isGameOver) {
        handleModalAction();
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
        keys.left = false;
      }
      if (e.code === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
        keys.right = false;
      }
    });

    // Touch & UI Controls
    const btnLeft = document.getElementById('btnMoveLeft');
    const btnRight = document.getElementById('btnMoveRight');
    const btnSpit = document.getElementById('btnSpit');
    const btnSwitch = document.getElementById('btnSwitchChar');
    const modalBtn = document.getElementById('modalActionBtn');

    btnLeft.addEventListener('mousedown', () => keys.left = true);
    btnLeft.addEventListener('mouseup', () => keys.left = false);
    btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); keys.left = true; });
    btnLeft.addEventListener('touchend', () => keys.left = false);

    btnRight.addEventListener('mousedown', () => keys.right = true);
    btnRight.addEventListener('mouseup', () => keys.right = false);
    btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); keys.right = true; });
    btnRight.addEventListener('touchend', () => keys.right = false);

    btnSpit.addEventListener('click', () => doSpit());
    btnSwitch.addEventListener('click', () => switchCharacter());
    modalBtn.addEventListener('click', () => handleModalAction());

    // Clicking on canvas directly aims and spits
    canvas.addEventListener('click', (e) => {
      if (isGameOver) {
        handleModalAction();
        return;
      }
      const rect = canvas.getBoundingClientRect();
      const clickX = ((e.clientX - rect.left) / rect.width) * INTERNAL_W;
      player.x = Math.max(90, Math.min(INTERNAL_W - 90, clickX));
      doSpit();
    });

    window.onload = function () {
      initLevel(0);
      requestAnimationFrame(loop);
    };
  </script>
</body>
</html>
